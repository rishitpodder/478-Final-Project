<!DOCTYPE html>
<html>
<head>
  <title>Heatmap</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  <style>
    body, #map { margin: 0; padding: 0; height: 100vh; }
    .legend {
      background: white;
      padding: 10px;
      font-size: 13px;
      color: #333;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 5px;
    }
    .legend i {
      width: 14px;
      height: 14px;
      float: left;
      margin-right: 6px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map').setView([30.6175, -96.3410], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  var heat = [
    [30.614731, -96.347685, 0.6],
    [30.616919, -96.344173, 0.3],
    [30.617200, -96.344467, 0.9],
    [30.618217, -96.344521, 0.6],
    [30.618800, -96.344100, 1.0],
    [30.619043, -96.342357, 0.6],
    [30.621200, -96.340400, 0.9],
    [30.617692, -96.341176, 0.6],
    [30.618664, -96.339042, 0.3],
    [30.617168, -96.337732, 0.9],
    [30.616283, -96.339276, 0.6],
    [30.615289, -96.335984, 1.0],
    [30.613386, -96.341635, 0.6],
    [30.611101, -96.341755, 0.6]
  ];

  L.heatLayer(heat, {
    radius: 30,
    blur: 20,
    maxZoom: 17
  }).addTo(map);

  var legend = L.control({ position: 'bottomright' });

  legend.onAdd = function () {
    var d = L.DomUtil.create('div', 'legend');
    d.innerHTML = '<b>Severity</b><br>' +
      '<i style="background: blue"></i> Low<br>' +
      '<i style="background: limegreen"></i> Medium<br>' +
      '<i style="background: orange"></i> High<br>' +
      '<i style="background: red"></i> Urgent';
    return d;
  };

  legend.addTo(map);
</script>
</body>
</html>
