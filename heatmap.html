<!DOCTYPE html>
<html>
<head>
  <title>Texas A&M Campus Heatmap</title>
  <meta charset="utf-8" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Leaflet.heat plugin -->
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <style>
    body { margin:0; padding:0; }
    #map { height: 100vh; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  var map = L.map('map').setView([30.6175, -96.3410], 15.5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  var heatPoints = [
    [30.614731, -96.347685, 0.6],
    [30.616919, -96.344173, 0.3],
    [30.617200, -96.344467, 0.9],
    [30.618217, -96.344521, 0.6],
    [30.618800, -96.344100, 1.0],
    [30.619043, -96.342357, 0.6],
    [30.621200, -96.340400, 0.9],
    [30.617692, -96.341176, 0.6],
    [30.618664, -96.339042, 0.3],
    [30.617168, -96.337732, 0.9],
    [30.616283, -96.339276, 0.6],
    [30.615289, -96.335984, 1.0],
    [30.613386, -96.341635, 0.6],
    [30.611101, -96.341755, 0.6]
  ];

  var heat = L.heatLayer(heatPoints, {
    radius: 25,
    blur: 15,
    maxZoom: 15
  }).addTo(map);
</script>

</body>
</html>
